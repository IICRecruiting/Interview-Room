<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>면접실 예약 현황</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #E9EAEE; overflow: hidden; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #C7CBD3; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* =========================================================
   ▼▼▼ 여기 두 줄만 채워주세요 (JSONBin.io 가입 후 발급) ▼▼▼
   ========================================================= */
const JSONBIN_BIN_ID = "6aa3894fffd5d16053f8e0c6";
const JSONBIN_API_KEY = "$2a$10$RGIsuY4oDJnBQV9dQfPXkOq5w7jUFVzANzPwaARId4Qp1TdMJm9qy";
/* ========================================================= */

const NEEDS_SETUP = JSONBIN_BIN_ID.includes("여기에") || JSONBIN_API_KEY.includes("여기에");
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

const ROOMS = [
  { id: 1, label: "RNT1", color: "#3D5A80", tint: "#EEF2F7" },
  { id: 2, label: "RNT2", color: "#9C6644", tint: "#F6F0E9" },
  { id: 3, label: "RNT3", color: "#4F6D4F", tint: "#EEF3EE" },
  { id: 4, label: "RNT4", color: "#6B4C7A", tint: "#F3EEF4" },
  { id: 5, label: "커피챗", color: "#B0546E", tint: "#FBEEF1", isVirtual: true },
];
const ROOM_BY_ID = Object.fromEntries(ROOMS.map(r => [r.id, r]));

const TYPES = {
  interview: { label: "면접", color: "#3457D5" },
  meeting: { label: "미팅", color: "#3F8F5F" },
  coffeechat: { label: "커피챗", color: "#C2607F" },
};
const TYPE_ORDER = ["interview", "meeting", "coffeechat"];

const CONFLICT_COLOR = "#B3401D";
const HOUR_HEIGHT_BASE = 60;
const DAY_START = 8;
const DAY_END = 21;
const MIN_TIME = "08:00";
const MAX_TIME = "21:00";
const clampZoom = (z) => Math.min(1.5, Math.max(0.6, z));

const pad2 = (n) => String(n).padStart(2, "0");
const toDateStr = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const toMin = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const dowLabel = (dateStr) => { const d = new Date(dateStr + "T00:00:00"); return ["일","월","화","수","목","금","토"][d.getDay()]; };
const fmtDate = (dateStr) => { const d = new Date(dateStr + "T00:00:00"); return `${d.getFullYear()}.${pad2(d.getMonth()+1)}.${pad2(d.getDate())} (${dowLabel(dateStr)})`; };
const addDays = (dateStr, delta) => { const d = new Date(dateStr + "T00:00:00"); d.setDate(d.getDate()+delta); return toDateStr(d); };
const genId = () => `${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
const emptyForm = { room: 1, team: "", start: "14:00", end: "15:00", type: "interview" };

async function fetchAllData() {
  const res = await fetch(`${JSONBIN_URL}/latest`, { headers: { "X-Master-Key": JSONBIN_API_KEY } });
  if (!res.ok) throw new Error("불러오기 실패");
  const json = await res.json();
  return json.record || {};
}
async function saveAllData(data) {
  const res = await fetch(JSONBIN_URL, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_API_KEY },
    body: JSON.stringify(data),
  });
  if (!res.ok) throw new Error("저장 실패");
}

function SetupNotice() {
  return (
    <div style={{ fontFamily: "-apple-system, 'Segoe UI', sans-serif", background: "#E9EAEE", height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ background: "#fff", borderRadius: 12, padding: 28, maxWidth: 480, lineHeight: 1.7 }}>
        <div style={{ fontSize: 17, fontWeight: 700, marginBottom: 10 }}>⚙️ 저장소 설정이 필요해요</div>
        <div style={{ fontSize: 14, color: "#3A3F4A" }}>
          이 파일 상단의 <code>JSONBIN_BIN_ID</code>, <code>JSONBIN_API_KEY</code> 두 값을
          jsonbin.io에서 발급받은 값으로 바꿔주세요.
        </div>
      </div>
    </div>
  );
}

function App() {
  const [currentDate, setCurrentDate] = useState(toDateStr(new Date()));
  const [allData, setAllData] = useState(null);
  const [loadError, setLoadError] = useState("");
  const [saveError, setSaveError] = useState("");
  const [modal, setModal] = useState(null);
  const [zoom, setZoom] = useState(0.85);
  const scrollRef = useRef(null);

  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const onWheel = (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        setZoom((z) => clampZoom(z - e.deltaY * 0.0012));
      }
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, []);

  useEffect(() => {
    let cancelled = false;
    fetchAllData()
      .then((data) => { if (!cancelled) setAllData(data); })
      .catch(() => { if (!cancelled) { setAllData({}); setLoadError("데이터를 불러오지 못했어요. 새로고침 해주세요."); } });
    return () => { cancelled = true; };
  }, []);

  const bookings = ((allData && allData[currentDate]) || []).map(b => ({ type: "interview", ...b }));
  const hourHeight = HOUR_HEIGHT_BASE * zoom;
  const totalHeight = hourHeight * (DAY_END - DAY_START);

  const typeCounts = { interview: 0, meeting: 0, coffeechat: 0 };
  bookings.forEach(b => { typeCounts[b.type] = (typeCounts[b.type] || 0) + 1; });

  const perRoomCount = ROOMS.map(r => ({ ...r, count: bookings.filter(b => b.room === r.id).length }));
  const maxRoomCount = Math.max(1, ...perRoomCount.map(r => r.count));

  const persist = useCallback(async (dateStr, list) => {
    const next = { ...(allData || {}), [dateStr]: list };
    setAllData(next);
    try { await saveAllData(next); setSaveError(""); }
    catch (e) { setSaveError("저장에 실패했어요. 네트워크를 확인하고 다시 시도해주세요."); }
  }, [allData]);

  const conflictIds = useMemo(() => {
    const bad = new Set();
    for (const room of ROOMS.filter(r => !r.isVirtual)) {
      const rb = bookings.filter(b => b.room === room.id).map(b => ({ ...b, s: toMin(b.start), e: toMin(b.end) })).sort((a,b) => a.s - b.s);
      for (let i = 0; i < rb.length; i++) for (let j = i+1; j < rb.length; j++) if (rb[j].s < rb[i].e) { bad.add(rb[i].id); bad.add(rb[j].id); }
    }
    return bad;
  }, [bookings]);

  const conflictPairs = useMemo(() => {
    const pairs = [];
    for (const room of ROOMS.filter(r => !r.isVirtual)) {
      const rb = bookings.filter(b => b.room === room.id).map(b => ({ ...b, s: toMin(b.start), e: toMin(b.end) })).sort((a,b) => a.s - b.s);
      for (let i = 0; i < rb.length; i++) for (let j = i+1; j < rb.length; j++) if (rb[j].s < rb[i].e) pairs.push({ room: room.label, a: rb[i], b: rb[j] });
    }
    return pairs;
  }, [bookings]);

  const openAdd = (roomId, startHour) => {
    const clampedHour = startHour != null ? Math.max(DAY_START, Math.min(DAY_END - 1, startHour)) : 14;
    const start = `${pad2(clampedHour)}:00`;
    const startM = toMin(start);
    const endM = Math.min(startM + 60, DAY_END * 60);
    const end = `${pad2(Math.floor(endM/60))}:${pad2(endM%60)}`;
    const room = roomId ?? 1;
    const type = ROOM_BY_ID[room]?.isVirtual ? "coffeechat" : "interview";
    setModal({ mode: "add", form: { ...emptyForm, room, start, end, type } });
  };
  const openEdit = (b) => setModal({ mode: "edit", form: { type: "interview", ...b } });
  const closeModal = () => setModal(null);

  const setRoom = (roomId) => {
    setModal(m => {
      const forcedType = ROOM_BY_ID[roomId]?.isVirtual ? "coffeechat" : m.form.type;
      return { ...m, form: { ...m.form, room: roomId, type: forcedType } };
    });
  };

  const handleSubmit = () => {
    const f = modal.form;
    if (!f.team.trim()) return;
    if (toMin(f.end) <= toMin(f.start)) return;
    const list = modal.mode === "add"
      ? [...bookings, { ...f, room: Number(f.room), id: genId() }]
      : bookings.map(b => b.id === f.id ? { ...f, room: Number(f.room) } : b);
    persist(currentDate, list);
    closeModal();
  };
  const handleDelete = (id) => { persist(currentDate, bookings.filter(b => b.id !== id)); closeModal(); };

  const hours = Array.from({ length: DAY_END - DAY_START }, (_, i) => i + DAY_START);

  if (allData === null) {
    return <div style={{ fontFamily: "-apple-system, sans-serif", padding: 40, color: "#6B7280" }}>불러오는 중...</div>;
  }

  const isVirtualRoomSelected = modal && ROOM_BY_ID[modal.form.room]?.isVirtual;

  return (
    <div style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", background: "#E9EAEE", color: "#181B21", height: "100vh", display: "flex", gap: 18, padding: 24, overflow: "hidden" }}>
      <div style={{ width: 264, flexShrink: 0, minHeight: 0, display: "flex", flexDirection: "column", gap: 12, overflowY: "auto" }}>
        <div style={{ background: "#181B21", color: "#fff", borderRadius: 12, padding: "16px 18px", boxShadow: "0 1px 3px rgba(20,22,28,0.12)" }}>
          <div style={{ fontSize: 11, letterSpacing: 0.4, color: "#9BA0AC", marginBottom: 8, fontWeight: 600 }}>면접실 운용 현황</div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <button onClick={() => setCurrentDate(d => addDays(d, -1))} style={iconBtnStyle}>◀</button>
            <div style={{ fontSize: 15.5, fontWeight: 700 }}>{fmtDate(currentDate)}</div>
            <button onClick={() => setCurrentDate(d => addDays(d, 1))} style={iconBtnStyle}>▶</button>
          </div>
          <button onClick={() => setCurrentDate(toDateStr(new Date()))} style={{ marginTop: 12, width: "100%", background: "#2A2F3A", color: "#D9DCE3", border: "none", borderRadius: 7, padding: "7px 0", fontSize: 12, cursor: "pointer", fontWeight: 500 }}>오늘로 이동</button>
          <div style={{ marginTop: 10, display: "flex", alignItems: "center", justifyContent: "space-between", background: "#2A2F3A", borderRadius: 7, padding: "5px 8px" }}>
            <button onClick={() => setZoom(z => clampZoom(z - 0.1))} style={zoomBtnStyle}>－</button>
            <span style={{ fontSize: 11.5, color: "#D9DCE3", fontFamily: "SFMono-Regular, Consolas, monospace" }}>{Math.round(zoom * 100)}%</span>
            <button onClick={() => setZoom(z => clampZoom(z + 0.1))} style={zoomBtnStyle}>＋</button>
          </div>
        </div>

        <div style={{ background: "#fff", borderRadius: 12, padding: "14px 16px", boxShadow: "0 1px 3px rgba(20,22,28,0.05)" }}>
          <div style={{ fontSize: 12, color: "#6B7280", marginBottom: 10, fontWeight: 600 }}>칸 (면접실 / 커피챗)</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {ROOMS.map(r => (
              <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 13.5 }}>
                <span style={{ width: 11, height: 11, borderRadius: 3.5, background: r.color, display: "inline-block" }} />{r.label}
              </div>
            ))}
          </div>
        </div>

        <div style={{ background: "#fff", borderRadius: 12, padding: "14px 16px", boxShadow: "0 1px 3px rgba(20,22,28,0.05)" }}>
          <div style={{ fontSize: 12, color: "#6B7280", marginBottom: 10, fontWeight: 600 }}>일정 유형</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {TYPE_ORDER.map(t => (
              <div key={t} style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 13.5 }}>
                <span style={{ width: 11, height: 11, borderRadius: 3.5, background: TYPES[t].color, display: "inline-block" }} />{TYPES[t].label}
              </div>
            ))}
          </div>
        </div>

        <div style={{ background: "#fff", borderRadius: 12, padding: "14px 16px", boxShadow: "0 1px 3px rgba(20,22,28,0.05)" }}>
          <div style={{ fontSize: 12, color: "#6B7280", marginBottom: 10, fontWeight: 600 }}>오늘 현황</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
            {TYPE_ORDER.map(t => (
              <div key={t} style={{ flex: 1, textAlign: "center", background: "#F5F6F8", borderRadius: 8, padding: "8px 4px" }}>
                <div style={{ fontSize: 17, fontWeight: 800, color: TYPES[t].color }}>{typeCounts[t]}</div>
                <div style={{ fontSize: 10.5, color: "#6B7280", marginTop: 2 }}>{TYPES[t].label}</div>
              </div>
            ))}
          </div>
          <div style={{ fontSize: 11, color: "#9BA0AC", marginBottom: 8 }}>칸별 예약 현황</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
            {perRoomCount.map(r => (
              <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12 }}>
                <span style={{ width: 44, color: "#6B7280" }}>{r.label}</span>
                <div style={{ flex: 1, height: 6, background: "#F0F1F4", borderRadius: 3, overflow: "hidden" }}>
                  <div style={{ width: `${(r.count / maxRoomCount) * 100}%`, height: "100%", background: r.color, borderRadius: 3 }} />
                </div>
                <span style={{ width: 14, textAlign: "right", color: "#3A3F4A", fontWeight: 600 }}>{r.count}</span>
              </div>
            ))}
          </div>
        </div>

        <div style={{ background: conflictPairs.length ? "#FBEAE3" : "#fff", border: conflictPairs.length ? `1px solid ${CONFLICT_COLOR}` : "1px solid transparent", borderRadius: 12, padding: "14px 16px", boxShadow: "0 1px 3px rgba(20,22,28,0.05)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5, fontWeight: 700, color: conflictPairs.length ? CONFLICT_COLOR : "#181B21" }}>⚠ 중복 예약 {conflictPairs.length}건</div>
          {conflictPairs.length > 0 ? conflictPairs.map((p,i) => (
            <div key={i} style={{ fontSize: 12, color: "#8A2E11", marginTop: 8, lineHeight: 1.55 }}>
              <b>{p.room}</b> · {p.a.team}({p.a.start}~{p.a.end}) ↔ {p.b.team}({p.b.start}~{p.b.end})
            </div>
          )) : <div style={{ fontSize: 12, color: "#9BA0AC", marginTop: 6 }}>겹치는 예약이 없어요.</div>}
        </div>

        <button onClick={() => openAdd()} style={addBtnStyle}>＋ 예약 추가</button>
        {(saveError || loadError) && <div style={{ color: CONFLICT_COLOR, fontSize: 12, padding: "0 2px" }}>{saveError || loadError}</div>}
      </div>

      <div style={{ flex: 1, minHeight: 0, background: "#fff", borderRadius: 12, overflow: "hidden", display: "flex", flexDirection: "column", boxShadow: "0 1px 3px rgba(20,22,28,0.06)" }}>
        <div style={{ display: "flex", borderBottom: "1px solid #E4E6EA", flexShrink: 0 }}>
          <div style={{ width: 56, flexShrink: 0 }} />
          {ROOMS.map(r => (
            <div key={r.id} style={{ flex: 1, textAlign: "center", padding: "12px 0", fontSize: 13.5, fontWeight: 700, borderLeft: "1px solid #E4E6EA", background: r.tint }}>
              <span style={{ width: 9, height: 9, borderRadius: 2.5, background: r.color, display: "inline-block", marginRight: 7 }} />{r.label}
            </div>
          ))}
        </div>
        <div ref={scrollRef} style={{ position: "relative", overflowY: "auto", flex: 1, minHeight: 0, paddingTop: 0, paddingBottom: 14 }}>
          <div style={{ display: "flex", position: "relative", height: totalHeight }}>
            <div style={{ width: 56, flexShrink: 0, position: "relative" }}>
              {hours.map(h => (
                <div key={h} style={{ position: "absolute", top: (h - DAY_START) * hourHeight + 4, right: 10, fontSize: 11, color: "#9BA0AC", fontFamily: "SFMono-Regular, Consolas, monospace", fontWeight: 500 }}>{pad2(h)}:00</div>
              ))}
              <div style={{ position: "absolute", top: totalHeight - 15, right: 10, fontSize: 11, color: "#9BA0AC", fontFamily: "SFMono-Regular, Consolas, monospace", fontWeight: 500 }}>{pad2(DAY_END)}:00</div>
            </div>
            {ROOMS.map(room => (
              <div key={room.id}
                onClick={(e) => {
                  if (e.target !== e.currentTarget) return;
                  const rect = e.currentTarget.getBoundingClientRect();
                  const y = e.clientY - rect.top;
                  const hour = DAY_START + Math.max(0, Math.min(DAY_END - DAY_START - 1, Math.floor(y / hourHeight)));
                  openAdd(room.id, hour);
                }}
                style={{ flex: 1, position: "relative", borderLeft: "1px solid #E4E6EA", borderTop: "1px solid #D7DAE0", borderBottom: "1px solid #D7DAE0", cursor: "copy" }}
              >
                {hours.map(h => (
                  <div key={h} style={{ position: "absolute", top: (h - DAY_START) * hourHeight, left: 0, right: 0, height: 1, background: h % 3 === 0 ? "#E4E6EA" : "#F0F1F4" }} />
                ))}
                {bookings.filter(b => b.room === room.id).map(b => {
                  const s = toMin(b.start), e = toMin(b.end);
                  const top = ((s - DAY_START * 60) / 60) * hourHeight;
                  const height = Math.max(((e - s) / 60) * hourHeight, 22);
                  const isConflict = conflictIds.has(b.id);
                  const typeColor = (TYPES[b.type] || TYPES.interview).color;
                  return (
                    <div key={b.id}
                      onClick={(ev) => { ev.stopPropagation(); openEdit(b); }}
                      style={{
                        position: "absolute", top, height, left: 5, right: 5, borderRadius: 7, padding: "5px 8px",
                        fontSize: 12, color: "#fff", cursor: "pointer", overflow: "hidden",
                        background: isConflict ? `repeating-linear-gradient(135deg, ${CONFLICT_COLOR}, ${CONFLICT_COLOR} 6px, #D6592E 6px, #D6592E 12px)` : typeColor,
                        boxShadow: isConflict ? `0 0 0 2px #fff, 0 0 0 3.5px ${CONFLICT_COLOR}` : "0 1px 2px rgba(0,0,0,0.15)",
                        zIndex: isConflict ? 2 : 1,
                      }}
                      title={`${TYPES[b.type]?.label || "면접"} · ${b.team} ${b.start}~${b.end}`}
                    >
                      <div style={{ fontWeight: 700, lineHeight: 1.35 }}>{isConflict ? "⚠ " : ""}{b.team}</div>
                      <div style={{ opacity: 0.9, fontSize: 11 }}>{b.start}~{b.end}</div>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        </div>
      </div>

      {modal && (
        <div onClick={closeModal} style={{ position: "fixed", inset: 0, background: "rgba(20,22,28,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: "#fff", borderRadius: 14, padding: 22, width: 320, boxShadow: "0 8px 24px rgba(0,0,0,0.18)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <div style={{ fontSize: 15.5, fontWeight: 700 }}>{modal.mode === "add" ? "일정 추가" : "일정 수정"}</div>
              <button onClick={closeModal} style={{ background: "none", border: "none", cursor: "pointer", color: "#9BA0AC", fontSize: 16 }}>✕</button>
            </div>

            <label style={labelStyle}>칸 (면접실 / 커피챗)</label>
            <select value={modal.form.room} onChange={e => setRoom(Number(e.target.value))} style={inputStyle}>
              {ROOMS.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}
            </select>

            <label style={labelStyle}>유형</label>
            {isVirtualRoomSelected ? (
              <div style={{ fontSize: 12.5, color: "#9BA0AC", padding: "6px 2px 4px" }}>커피챗 칸은 유형이 자동으로 '커피챗'으로 지정돼요.</div>
            ) : (
              <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                {TYPE_ORDER.map(t => (
                  <button
                    key={t}
                    type="button"
                    onClick={() => setModal(m => ({ ...m, form: { ...m.form, type: t } }))}
                    style={{
                      flex: 1, padding: "7px 0", borderRadius: 7, fontSize: 12.5, fontWeight: 700, cursor: "pointer",
                      border: modal.form.type === t ? `1.5px solid ${TYPES[t].color}` : "1.5px solid #E4E6EA",
                      background: modal.form.type === t ? TYPES[t].color : "#fff",
                      color: modal.form.type === t ? "#fff" : "#6B7280",
                    }}
                  >{TYPES[t].label}</button>
                ))}
              </div>
            )}

            <label style={labelStyle}>팀 / 지원자명</label>
            <input value={modal.form.team} onChange={e => setModal(m => ({ ...m, form: { ...m.form, team: e.target.value } }))} placeholder="예: 법무전략팀" style={inputStyle} autoFocus />
            <div style={{ display: "flex", gap: 8 }}>
              <div style={{ flex: 1 }}>
                <label style={labelStyle}>시작</label>
                <input type="time" value={modal.form.start} min={MIN_TIME} max={MAX_TIME} onChange={e => setModal(m => ({ ...m, form: { ...m.form, start: e.target.value } }))} style={inputStyle} />
              </div>
              <div style={{ flex: 1 }}>
                <label style={labelStyle}>종료</label>
                <input type="time" value={modal.form.end} min={MIN_TIME} max={MAX_TIME} onChange={e => setModal(m => ({ ...m, form: { ...m.form, end: e.target.value } }))} style={inputStyle} />
              </div>
            </div>
            {toMin(modal.form.end) <= toMin(modal.form.start) && <div style={{ color: CONFLICT_COLOR, fontSize: 12, marginTop: -6, marginBottom: 10 }}>종료 시간은 시작 시간보다 늦어야 해요.</div>}
            {(toMin(modal.form.start) < toMin(MIN_TIME) || toMin(modal.form.end) > toMin(MAX_TIME)) && <div style={{ color: CONFLICT_COLOR, fontSize: 12, marginTop: -6, marginBottom: 10 }}>운영 시간(08:00~21:00)을 벗어났어요.</div>}
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              {modal.mode === "edit" && <button onClick={() => handleDelete(modal.form.id)} style={deleteBtnStyle}>🗑 삭제</button>}
              <button onClick={handleSubmit} style={saveBtnStyle}>저장</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const iconBtnStyle = { background: "#2A2F3A", border: "none", color: "#D9DCE3", width: 28, height: 28, borderRadius: 7, cursor: "pointer", fontSize: 12 };
const zoomBtnStyle = { background: "#3A404C", border: "none", color: "#D9DCE3", width: 22, height: 22, borderRadius: 5, cursor: "pointer", fontSize: 12, lineHeight: 1 };
const addBtnStyle = { display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: "#181B21", color: "#fff", border: "none", borderRadius: 9, padding: "11px 0", fontSize: 13.5, fontWeight: 700, cursor: "pointer", boxShadow: "0 1px 3px rgba(20,22,28,0.15)" };
const labelStyle = { display: "block", fontSize: 11.5, color: "#6B7280", marginBottom: 4, marginTop: 10, fontWeight: 500 };
const inputStyle = { width: "100%", boxSizing: "border-box", border: "1px solid #E4E6EA", borderRadius: 8, padding: "8px 10px", fontSize: 13.5, marginBottom: 4 };
const deleteBtnStyle = { display: "flex", alignItems: "center", gap: 5, background: "#fff", color: CONFLICT_COLOR, border: `1px solid ${CONFLICT_COLOR}`, borderRadius: 9, padding: "9px 12px", fontSize: 13, cursor: "pointer" };
const saveBtnStyle = { flex: 1, background: "#181B21", color: "#fff", border: "none", borderRadius: 9, padding: "9px 0", fontSize: 13.5, fontWeight: 700, cursor: "pointer" };

ReactDOM.createRoot(document.getElementById("root")).render(NEEDS_SETUP ? <SetupNotice /> : <App />);
</script>
</body>
</html>
